<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100vw; height: 100vh; margin: 0; padding: 0; background: #0b0f19; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; display: flex; flex-direction: column; overflow-y: auto; user-select: none;">
      
      <style>
        * { box-sizing: border-box; }
        
        .navbar {
          width: 100%;
          padding: 16px 24px;
          background: #111827;
          border-bottom: 1px solid #1f2937;
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: sticky;
          top: 0;
          z-index: 50;
        }

        .nav-brand {
          display: flex;
          align-items: center;
          gap: 12px;
          font-weight: 900;
          font-size: 1.35rem;
          color: #f97316;
          letter-spacing: 0.5px;
        }

        .eagle-icon {
          width: 38px;
          height: 38px;
          background: linear-gradient(135deg, #f97316, #ea580c);
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.2rem;
          box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .main-container {
          max-width: 900px;
          width: 100%;
          margin: 0 auto;
          padding: 30px 20px;
          display: flex;
          flex-direction: column;
          gap: 24px;
        }

        .hero-banner {
          background: linear-gradient(135deg, #1f2937, #111827);
          border: 1px solid #374151;
          border-radius: 16px;
          padding: 30px;
          text-align: center;
          box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .hero-banner h1 {
          margin: 0 0 8px 0;
          font-size: 2.2rem;
          font-weight: 900;
          color: #ffffff;
        }

        .hero-banner p {
          color: #94a3b8;
          font-size: 1rem;
          margin: 0;
        }

        .games-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 20px;
        }

        .game-card {
          background: #1f2937;
          border: 1px solid #374151;
          border-radius: 16px;
          padding: 24px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
          cursor: pointer;
        }

        .game-card:hover {
          transform: translateY(-4px);
          border-color: #f97316;
          box-shadow: 0 12px 30px rgba(249, 115, 22, 0.2);
        }

        .game-icon {
          font-size: 2.5rem;
          margin-bottom: 12px;
        }

        .game-title {
          font-size: 1.25rem;
          font-weight: 800;
          color: #f8fafc;
          margin: 0 0 6px 0;
        }

        .game-desc {
          color: #94a3b8;
          font-size: 0.9rem;
          line-height: 1.4;
          margin-bottom: 20px;
        }

        .play-btn {
          background: #f97316;
          color: white;
          border: none;
          padding: 10px 18px;
          border-radius: 8px;
          font-weight: 700;
          font-size: 0.95rem;
          cursor: pointer;
          transition: background 0.2s;
          text-align: center;
          text-decoration: none;
        }
        .play-btn:hover { background: #ea580c; }
      </style>

      <!-- Navbar -->
      <div class="navbar">
        <div class="nav-brand">
          <div class="eagle-icon">🦅</div>
          <span>LMS GAMING HUB</span>
        </div>
        <div id="statusBadge" style="font-size:0.85rem; font-weight:700; color:#38bdf8; background:#0f172a; padding:6px 12px; border-radius:8px; border:1px solid #334155;">
          Online • Ready
        </div>
      </div>

      <!-- Main Hub Container -->
      <div class="main-container">
        
        <!-- Hero Banner -->
        <div class="hero-banner">
          <h1>Welcome to LMS Arcade</h1>
          <p>Select an arcade game below to play instantly. All scores save locally to your browser.</p>
        </div>

        <!-- Games Grid -->
        <div class="games-grid">
          
          <!-- Game 1: Flappy Square -->
          <div class="game-card" onclick="location.href='flappy.svg'">
            <div>
              <div class="game-icon">🟩</div>
              <h3 class="game-title">Flappy Square</h3>
              <p class="game-desc">Test your timing by navigating your custom-colored square through narrow pipe gaps in an endless arcade run.</p>
            </div>
            <a class="play-btn" href="flappy.svg">Play Flappy Square</a>
          </div>

          <!-- Game 2: NFL 17-0 Challenge -->
          <div class="game-card" onclick="location.href='1leawoodms.svg'">
            <div>
              <div class="game-icon">🏈</div>
              <h3 class="game-title">17-0 NFL Challenge</h3>
              <p class="game-desc">Draft key player positions across football eras, build your elite roster, and simulate an undefeated championship run.</p>
            </div>
            <a class="play-btn" href="1leawoodms.svg">Play NFL Challenge</a>
          </div>

        </div>

      </div>

    </div>
  </foreignObject>
</svg>
