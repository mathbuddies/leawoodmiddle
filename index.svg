      <style>
        * { box-sizing: border-box; }

        /* Top Announcement Banner */
        .top-banner {
          width: 100%;
          background: linear-gradient(90deg, rgba(2,132,199,0.8), rgba(56,189,248,0.8), rgba(2,132,199,0.8));
