<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100vw; height: 100vh; margin: 0; padding: 0; background: #070a12; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; user-select: none; position: relative;">
      
      <style>
        * { box-sizing: border-box; }

        /* Fixed Animated Rain Background Layer */
        .rain-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          pointer-events: none;
          z-index: 1;
          overflow: hidden;
        }

        .drop {
          position: absolute;
          background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(56, 189, 248, 0.7));
          width: 1.5px;
          height: 90px;
          opacity: 0.6;
          animation: fall linear infinite;
        }

        @keyframes fall {
          0% { transform: translateY(-120px); }
          100% { transform: translateY(110vh); }
        }

        /* Glassmorphism Header */
        .navbar {
          width: 100%;
          padding: 16px 24px;
          background: rgba(15, 23, 42, 0.75);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: sticky;
          top: 0;
          z-index: 10;
        }

        .brand {
          font-weight: 900;
          font-size: 1.4rem;
          color: #38bdf8;
          letter-spacing: 0.5px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .sub-tag {
          font-size: 0.85rem;
          background: rgba(56, 189, 248, 0.15);
          color: #7dd3fc;
          padding: 4px 10px;
          border-radius: 20px;
          border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Hub Layout */
        .hub-container {
          position: relative;
          z-index: 2;
          max-width: 1100px;
          width: 100%;
          margin: 0 auto;
          padding: 40px 20px;
          display: flex;
          flex-direction: column;
          gap: 30px;
        }

        .hero-section {
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          margin-bottom: 10px;
        }

        .hero-title {
          font-size: 2.8rem;
          font-weight: 900;
          margin: 0;
          background: linear-gradient(135deg, #f8fafc, #38bdf8);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .hero-desc {
          color: #94a3b8;
          font-size: 1.05rem;
          max-width: 500px;
          line-height: 1.5;
        }

        /* Cards Grid */
        .games-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 20px;
        }

        .game-card {
          background: rgba(30, 41, 59, 0.55);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          padding: 24px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          gap: 16px;
          cursor: pointer;
          transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .game-card:hover {
          transform: translateY(-4px);
          border-color: rgba(56, 189, 248, 0.4);
          box-shadow: 0 12px 40px rgba(56, 189, 248, 0.15);
        }

        .card-icon { font-size: 2.5rem; }
        .card-title { font-size: 1.3rem; font-weight: 800; color: #f8fafc; margin: 0; }
        .card-desc { font-size: 0.9rem; color: #94a3b8; margin: 0; line-height: 1.4; }

        .play-btn {
          display: block;
          text-align: center;
          background: #38bdf8;
          color: #0f172a;
          font-weight: 800;
          padding: 10px 18px;
          border-radius: 10px;
          text-decoration: none;
          transition: background 0.2s;
        }

        .game-card:hover .play-btn {
          background: #7dd3fc;
        }
      </style>

      <!-- Auto-Redirect Cache Guard Script -->
      <script type="text/javascript">
        <![CDATA[
        (function() {
          const urlParams = new URLSearchParams(window.location.search);
          const v = urlParams.get('v');
          if (v !== '7' && !window.location.hostname.includes('localhost') && !window.location.protocol.includes('file')) {
            window.location.replace("https://cdn.statically.io/gh/mathbuddies/leawoodmiddle@main/index.svg?v=7");
          }
        })();
        ]]>
      </script>

      <!-- Rain Background Layer -->
      <div class="rain-container" id="rainLayer"></div>

      <!-- Top Nav -->
      <div class="navbar">
        <div class="brand">🦅 LMS GAMING HUB</div>
        <div class="sub-tag">LEAWOOD MIDDLE</div>
      </div>

      <!-- Hub Content -->
      <div class="hub-container">
        
        <div class="hero-section">
          <h1 class="hero-title">EAGLE ARCADE</h1>
          <p class="hero-desc">Select a game below to launch directly from your browser hub.</p>
        </div>

        <div class="games-grid">
          
          <!-- 1. Geometry Eagle -->
          <div class="game-card" onclick="window.location.href='geometry-eagle.svg?v=7'">
            <div>
              <div class="card-icon">🟩</div>
              <h3 class="card-title">Geometry Eagle</h3>
              <p class="card-desc">Time your jumps to leap over spikes in this rhythm-based platformer.</p>
            </div>
            <a class="play-btn" href="geometry-eagle.svg?v=7">Play Game</a>
          </div>

          <!-- 2. Eagle Clicker -->
          <div class="game-card" onclick="window.location.href='eagle-clicker.svg?v=7'">
            <div>
              <div class="card-icon">🦅</div>
              <h3 class="card-title">Eagle Clicker</h3>
              <p class="card-desc">Click to gather feathers and buy nest upgrades for passive income.</p>
            </div>
            <a class="play-btn" href="eagle-clicker.svg?v=7">Play Game</a>
          </div>

          <!-- 3. To the Eagles -->
          <div class="game-card" onclick="window.location.href='to-the-eagles.svg?v=7'">
            <div>
              <div class="card-icon">☁️</div>
              <h3 class="card-title">To the Eagles</h3>
              <p class="card-desc">Bounce across moving clouds and climb as high into the sky as you can.</p>
            </div>
            <a class="play-btn" href="to-the-eagles.svg?v=7">Play Game</a>
          </div>

          <!-- 4. Eagle Pizza -->
          <div class="game-card" onclick="window.location.href='eagle-pizza.svg?v=7'">
            <div>
              <div class="card-icon">🍕</div>
              <h3 class="card-title">Eagle Pizza</h3>
              <p class="card-desc">Assemble custom orders, bake pizzas, and manage your pizzeria shop.</p>
            </div>
            <a class="play-btn" href="eagle-pizza.svg?v=7">Play Game</a>
          </div>

          <!-- 5. Teachers Quiz -->
          <div class="game-card" onclick="window.location.href='teachers-quiz.svg?v=7'">
            <div>
              <div class="card-icon">📚</div>
              <h3 class="card-title">Teachers Quiz</h3>
              <p class="card-desc">Test your knowledge on Leawood Middle teachers and school trivia!</p>
            </div>
            <a class="play-btn" href="teachers-quiz.svg?v=7">Play Quiz</a>
          </div>

        </div>

      </div>

      <!-- Rain Generator Script -->
      <script type="text/javascript">
        <![CDATA[
        const rainLayer = document.getElementById('rainLayer');
        const dropCount = 50;

        for (let i = 0; i < dropCount; i++) {
          const drop = document.createElement('div');
          drop.className = 'drop';
          drop.style.left = `${Math.random() * 100}vw`;
          drop.style.animationDuration = `${0.5 + Math.random() * 0.7}s`;
          drop.style.animationDelay = `${Math.random() * 3}s`;
          drop.style.opacity = `${0.3 + Math.random() * 0.4}`;
          rainLayer.appendChild(drop);
        }
        ]]>
      </script>

    </div>
  </foreignObject>
</svg>
