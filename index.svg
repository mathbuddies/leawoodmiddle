<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" id="appRoot" style="width: 100vw; height: 100vh; margin: 0; padding: 0; background: #070a12; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; user-select: none; position: relative;">
      
      <style>
        * { box-sizing: border-box; }

        :root {
          --accent-color: #38bdf8;
        }

        /* Navbar - Simplified for Maximum Speed */
        .navbar {
          width: 100%;
          padding: 14px 24px;
          background: #0f172a;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: sticky;
          top: 0;
          z-index: 100;
        }

        .nav-left, .nav-right {
          display: flex;
          align-items: center;
          gap: 14px;
          position: relative;
        }

        .btn {
          background: #1e293b;
          border: 1px solid rgba(255, 255, 255, 0.15);
          color: #f8fafc;
          padding: 8px 14px;
          border-radius: 10px;
          cursor: pointer;
          font-weight: bold;
          font-size: 0.9rem;
        }
        .btn:hover { background: var(--accent-color); color: #0f172a; }

        .brand { font-weight: 900; font-size: 1.2rem; color: var(--accent-color); }
        .meta-info { font-size: 0.75rem; color: #94a3b8; font-family: monospace; }

        /* Dropdown Menu */
        .dropdown-menu {
          position: absolute; top: 45px; left: 0; width: 240px;
          background: #0f172a;
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 14px; padding: 12px; display: none; flex-direction: column; gap: 8px;
          box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 200;
        }
        .dropdown-menu.open { display: flex; }

        .dropdown-item {
          background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08);
          color: #f8fafc; padding: 10px 12px; border-radius: 8px; font-weight: 600;
          cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
        }
        .dropdown-item:hover { background: var(--accent-color); color: #0f172a; }

        /* Modals */
        .modal-overlay {
          position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
          background: rgba(0, 0, 0, 0.7); z-index: 300; display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal-card {
          background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 14px;
        }

        .modal-input {
          width: 100%; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.15);
          color: #f8fafc; padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem;
        }

        /* Hub Layout */
        .container { max-width: 1100px; width: 100%; margin: 0 auto; padding: 30px 20px; display: flex; flex-direction: column; gap: 24px; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .hero-title { font-size: 2.2rem; font-weight: 900; margin: 0; color: var(--accent-color); }
        
        .select-box {
          background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.15);
          color: #f8fafc; padding: 8px 14px; border-radius: 10px; font-weight: bold; outline: none; cursor: pointer;
        }

        /* Widgets */
        .widgets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .widget-card {
          background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 18px;
          display: flex; flex-direction: column; gap: 8px;
        }
        .widget-title { font-size: 0.85rem; font-weight: 800; color: var(--accent-color); }

        /* Games Grid */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        .game-card {
          background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; position: relative;
        }
        .game-card:hover { border-color: var(--accent-color); }
        .play-btn { background: var(--accent-color); color: #0f172a; font-weight: 800; padding: 10px; border-radius: 10px; text-align: center; font-size: 0.9rem; }
        
        .fav-star {
          position: absolute; top: 16px; right: 16px; background: #1e293b;
          border: 1px solid rgba(255,255,255,0.15); width: 32px; height: 32px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer;
        }
        .fav-star.active { color: #facc15; }
      </style>

      <!-- First-Visit Name Modal -->
      <div class="modal-overlay" id="nameModal" style="display:none;">
        <div class="modal-card">
          <h3 style="margin:0; color:var(--accent-color);">Welcome to eagle.io</h3>
          <p style="color:#94a3b8; font-size:0.85rem; margin:0;">What should we call you?</p>
          <input type="text" class="modal-input" id="userNameInput" placeholder="Enter your name..." />
          <button onclick="saveName()" class="btn" style="background:var(--accent-color); color:#0f172a;">Get Started</button>
        </div>
      </div>

      <!-- Settings / Themes Modal -->
      <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
          <h3 style="margin:0; color:var(--accent-color);">Settings</h3>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <span style="font-size:0.85rem; color:#94a3b8;">Change Accent Color:</span>
            <div style="display:flex; gap:10px;">
              <button class="btn" onclick="setAccent('#38bdf8')" style="background:#38bdf8; width:30px; height:30px; padding:0; border-radius:50%;"></button>
              <button class="btn" onclick="setAccent('#22c55e')" style="background:#22c55e; width:30px; height:30px; padding:0; border-radius:50%;"></button>
              <button class="btn" onclick="setAccent('#facc15')" style="background:#facc15; width:30px; height:30px; padding:0; border-radius:50%;"></button>
              <button class="btn" onclick="setAccent('#ef4444')" style="background:#ef4444; width:30px; height:30px; padding:0; border-radius:50%;"></button>
            </div>
          </div>
          <button onclick="closeModal('settingsModal')" class="btn">Close</button>
        </div>
      </div>

      <!-- Navbar -->
      <div class="navbar">
        <div class="nav-left">
          <button class="btn" id="menuBtn">Apps</button>
          
          <div class="dropdown-menu" id="appsDropdown">
            <div class="dropdown-item" onclick="openApp('latest')">🚀 Latest Version</div>
            <div class="dropdown-item" onclick="openApp('settings')">🎨 Themes and Settings</div>
            <div class="dropdown-item" onclick="openApp('profile')">👤 Change Name</div>
          </div>

          <div>
            <div class="brand">eagle.io</div>
            <div class="meta-info">v40 • <span id="liveClock">00:00:00</span></div>
          </div>
        </div>
      </div>

      <!-- Content Container -->
      <div class="container">
        <div class="header-row">
          <h1 class="hero-title" id="heroGreeting">My Hub</h1>
          <select class="select-box" id="mainNavSelect">
            <option value="hub">My Hub</option>
            <option value="games">Games</option>
          </select>
        </div>

        <!-- My Hub View -->
        <div id="myHubView" style="display:flex; flex-direction:column; gap:20px;">
          <div class="widgets-grid">
            <div class="widget-card">
              <div class="widget-title">Local Time</div>
              <div style="font-size:1.5rem; font-weight:900;" id="widgetClock">00:00:00</div>
              <div style="font-size:0.75rem; color:#94a3b8;" id="widgetDate">Loading date...</div>
            </div>
            <div class="widget-card">
              <div class="widget-title">Leawood Weather</div>
              <div style="font-size:1.5rem; font-weight:900; color:#7dd3fc;">56°F Clear</div>
              <div style="font-size:0.75rem; color:#94a3b8;">Leawood, Kansas</div>
            </div>
            <div class="widget-card">
              <div class="widget-title">Quick Notes</div>
              <textarea id="quickNotes" class="modal-input" placeholder="Notes..." style="height:60px; resize:none; font-size:0.8rem;"></textarea>
            </div>
          </div>
          <h3 style="margin:0; color:var(--accent-color);">Favorite Games</h3>
          <div class="games-grid" id="favoritesGrid"></div>
        </div>

        <!-- Games View (Includes Favorites) -->
        <div id="gamesView" class="games-grid" style="display:none;">
          <div class="game-card" data-id="geometry-eagle">
            <div class="fav-star" onclick="toggleFavorite('geometry-eagle')">★</div>
            <div style="font-size:2rem;">🟩</div>
            <div style="font-size:1.1rem; font-weight:800;">Geometry Eagle</div>
            <div style="color:#94a3b8; font-size:0.85rem;">Time your jumps over spikes in this rhythm platformer.</div>
            <a class="play-btn" href="geometry-eagle.svg?v=40">Play Game</a>
          </div>

          <div class="game-card" data-id="eagle-clicker">
            <div class="fav-star" onclick="toggleFavorite('eagle-clicker')">★</div>
            <div style="font-size:2rem;">🦅</div>
            <div style="font-size:1.1rem; font-weight:800;">Eagle Clicker</div>
            <div style="color:#94a3b8; font-size:0.85rem;">Gather feathers and buy nest upgrades for passive income.</div>
            <a class="play-btn" href="eagle-clicker.svg?v=40">Play Game</a>
          </div>

          <div class="game-card" data-id="to-the-eagles">
            <div class="fav-star" onclick="toggleFavorite('to-the-eagles')">★</div>
            <div style="font-size:2rem;">☁️</div>
            <div style="font-size:1.1rem; font-weight:800;">To the Eagles</div>
            <div style="color:#94a3b8; font-size:0.85rem;">Bounce across moving clouds and climb as high as possible.</div>
            <a class="play-btn" href="to-the-eagles.svg?v=40">Play Game</a>
          </div>

          <div class="game-card" data-id="eagle-pizza">
            <div class="fav-star" onclick="toggleFavorite('eagle-pizza')">★</div>
            <div style="font-size:2rem;">🍕</div>
            <div style="font-size:1.1rem; font-weight:800;">Eagle Pizza</div>
            <div style="color:#94a3b8; font-size:0.85rem;">Assemble custom orders and manage your pizza shop.</div>
            <a class="play-btn" href="eagle-pizza.svg?v=40">Play Game</a>
          </div>
        </div>
      </div>

      <script type="text/javascript">
        <![CDATA[
        window.setAccent = function(color) {
          document.documentElement.style.setProperty('--accent-color', color);
          localStorage.setItem('eagle_accent', color);
        };

        window.openApp = function(app) {
          document.getElementById('appsDropdown').classList.remove('open');
          if (app === 'latest') window.location.href = `index.svg?v=${Date.now()}`;
          if (app === 'settings') document.getElementById('settingsModal').classList.add('open');
          if (app === 'profile') {
            const name = prompt('Enter your name:', localStorage.getItem('eagle_user_name') || '');
            if (name) { localStorage.setItem('eagle_user_name', name); updateGreeting(name); }
          }
        };

        window.closeModal = function(id) {
          document.getElementById(id).classList.remove('open');
        };

        window.saveName = function() {
          const val = document.getElementById('userNameInput').value.trim();
          if (val) {
            localStorage.setItem('eagle_user_name', val);
            localStorage.setItem('eagle_tut', 'true');
            document.getElementById('nameModal').style.display = 'none';
            updateGreeting(val);
          }
        };

        function updateGreeting(name) {
          document.getElementById('heroGreeting').textContent = `Welcome back, ${name}!`;
        }

        window.addEventListener('DOMContentLoaded', () => {
          document.title = "eagle.io";

          // Accent setup
          const savedAccent = localStorage.getItem('eagle_accent') || '#38bdf8';
          setAccent(savedAccent);

          // Name check
          if (!localStorage.getItem('eagle_tut')) {
            document.getElementById('nameModal').style.display = 'flex';
          } else {
            updateGreeting(localStorage.getItem('eagle_user_name') || 'Gamer');
          }

          // Clock
          setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const dateStr = now.toLocaleDateString();
            document.getElementById('liveClock').textContent = timeStr;
            document.getElementById('widgetClock').textContent = timeStr;
            document.getElementById('widgetDate').textContent = dateStr;
          }, 1000);

          // Notes
          const notes = document.getElementById('quickNotes');
          notes.value = localStorage.getItem('eagle_notes') || '';
          notes.oninput = (e) => localStorage.setItem('eagle_notes', e.target.value);

          // Dropdown toggle
          const menuBtn = document.getElementById('menuBtn');
          const dropdown = document.getElementById('appsDropdown');
          menuBtn.onclick = (e) => { e.stopPropagation(); dropdown.classList.toggle('open'); };
          window.onclick = () => dropdown.classList.remove('open');

          // View Switching
          const navSelect = document.getElementById('mainNavSelect');
          const hubView = document.getElementById('myHubView');
          const gamesView = document.getElementById('gamesView');

          navSelect.onchange = () => {
            if (navSelect.value === 'hub') {
              hubView.style.display = 'flex';
              gamesView.style.display = 'none';
              renderFavorites();
            } else {
              hubView.style.display = 'none';
              gamesView.style.display = 'grid';
            }
          };

          // Favorites
          let favorites = JSON.parse(localStorage.getItem('eagle_favs') || '[]');

          window.toggleFavorite = function(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('eagle_favs', JSON.stringify(favorites));
            updateFavUI();
            if (navSelect.value === 'hub') renderFavorites();
          };

          function updateFavUI() {
            document.querySelectorAll('.game-card').forEach(card => {
              const id = card.getAttribute('data-id');
              const star = card.querySelector('.fav-star');
              if (favorites.includes(id)) { star.classList.add('active'); star.textContent = '★'; }
              else { star.classList.remove('active'); star.textContent = '☆'; }
            });
          }

          function renderFavorites() {
            const container = document.getElementById('favoritesGrid');
            container.innerHTML = '';
            const allGames = document.querySelectorAll('#gamesView .game-card');
            let count = 0;
            allGames.forEach(card => {
              const id = card.getAttribute('data-id');
              if (favorites.includes(id)) {
                const clone = card.cloneNode(true);
                clone.querySelector('.fav-star').onclick = () => toggleFavorite(id);
                container.appendChild(clone);
                count++;
              }
            });
            if (count === 0) {
              container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem;">No favorite games starred yet! Switch to the Games tab to star some.</div>';
            }
          }

          updateFavUI();
          renderFavorites();
        });
        ]]>
      </script>

    </div>
  </foreignObject>
</svg>
