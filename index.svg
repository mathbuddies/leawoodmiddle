          z-index: 12;
          position: sticky;
          top: 0;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Fixed & Blurred Rain Background Layer */
        .rain-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          pointer-events: none;
          z-index: 0;
          overflow: hidden;
          filter: blur(1.5px);
          -webkit-filter: blur(1.5px);
        }

        .drop {
          position: absolute;
          background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(56, 189, 248, 0.6));
          width: 1.5px;
          height: 90px;
          animation: fall linear infinite;
        }

        @keyframes fall {
          0% { transform: translateY(-120px); }
          100% { transform: translateY(105vh); }
        }

        /* Liquid Glass Navbar */
        .navbar {
          width: 100%;
          padding: 16px 32px;
          background: rgba(15, 23, 42, 0.45);
          backdrop-filter: blur(16px);
