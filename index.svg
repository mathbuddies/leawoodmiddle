<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 800" style="background: #070a12; font-family: system-ui, sans-serif;">
  <defs>
    <style>
      .bg { fill: #070a12; }
      .banner { fill: #0284c7; }
      .banner-text { fill: #ffffff; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .nav-bg { fill: rgba(15, 23, 42, 0.9); stroke: rgba(255,255,255,0.1); }
      .nav-title { fill: #38bdf8; font-size: 24px; font-weight: 900; }
      .nav-version { fill: #94a3b8; font-size: 14px; font-family: monospace; }
      
      .card-bg { fill: rgba(30, 41, 59, 0.6); stroke: rgba(255, 255, 255, 0.1); rx: 16px; transition: 0.2s; }
      .card-title { fill: #f8fafc; font-size: 22px; font-weight: bold; }
      .card-desc { fill: #94a3b8; font-size: 14px; }
      .card-btn { fill: #38bdf8; rx: 8px; }
      .card-btn-text { fill: #0f172a; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" class="bg" />

  <!-- Top Banner -->
  <rect width="1200" height="35" class="banner" />
  <text x="600" y="22" class="banner-text">🦅 EAGLE ARCADE - VERSION 22 (FINAL FIX) 🦅</text>

  <!-- Navbar -->
  <rect x="0" y="35" width="1200" height="70" class="nav-bg" />
  <text x="40" y="77" class="nav-title">LMS GAMING HUB</text>
  <text x="1120" y="75" class="nav-version">v22</text>

  <!-- Game Card 1: Geometry Eagle -->
  <g transform="translate(60, 140)" cursor="pointer" onclick="window.location.href='geometry-eagle.svg?v=22'">
    <rect width="340" height="250" class="card-bg" />
    <text x="30" y="55" font-size="36">🟩</text>
    <text x="30" y="110" class="card-title">Geometry Eagle</text>
    <text x="30" y="140" class="card-desc">Leap over spikes in this rhythm platformer.</text>
    <rect x="30" y="175" width="280" height="40" class="card-btn" />
    <text x="170" y="200" class="card-btn-text">Play Game</text>
  </g>

  <!-- Game Card 2: Eagle Clicker -->
  <g transform="translate(430, 140)" cursor="pointer" onclick="window.location.href='eagle-clicker.svg?v=22'">
    <rect width="340" height="250" class="card-bg" />
    <text x="30" y="55" font-size="36">🦅</text>
    <text x="30" y="110" class="card-title">Eagle Clicker</text>
    <text x="30" y="140" class="card-desc">Gather feathers and buy nest upgrades.</text>
    <rect x="30" y="175" width="280" height="40" class="card-btn" />
    <text x="170" y="200" class="card-btn-text">Play Game</text>
  </g>

  <!-- Game Card 3: To the Eagles -->
  <g transform="translate(800, 140)" cursor="pointer" onclick="window.location.href='to-the-eagles.svg?v=22'">
    <rect width="340" height="250" class="card-bg" />
    <text x="30" y="55" font-size="36">☁️</text>
    <text x="30" y="110" class="card-title">To the Eagles</text>
    <text x="30" y="140" class="card-desc">Bounce across moving clouds into the sky.</text>
    <rect x="30" y="175" width="280" height="40" class="card-btn" />
    <text x="170" y="200" class="card-btn-text">Play Game</text>
  </g>

  <!-- Game Card 4: Eagle Pizza -->
  <g transform="translate(60, 430)" cursor="pointer" onclick="window.location.href='eagle-pizza.svg?v=22'">
    <rect width="340" height="250" class="card-bg" />
    <text x="30" y="55" font-size="36">🍕</text>
    <text x="30" y="110" class="card-title">Eagle Pizza</text>
    <text x="30" y="140" class="card-desc">Bake pizzas and manage your shop.</text>
    <rect x="30" y="175" width="280" height="40" class="card-btn" />
    <text x="170" y="200" class="card-btn-text">Play Game</text>
  </g>

  <!-- Game Card 5: Teachers Quiz -->
  <g transform="translate(430, 430)" cursor="pointer" onclick="window.location.href='teachers-quiz.svg?v=22'">
    <rect width="340" height="250" class="card-bg" />
    <text x="30" y="55" font-size="36">📚</text>
    <text x="30" y="110" class="card-title">Teachers Quiz</text>
    <text x="30" y="140" class="card-desc">Test your knowledge on LMS teachers.</text>
    <rect x="30" y="175" width="280" height="40" class="card-btn" />
    <text x="170" y="200" class="card-btn-text">Play Quiz</text>
  </g>
</svg>
