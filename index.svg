<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100vw; height: 100vh; margin: 0; padding: 0; background: #070a12; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; user-select: none; position: relative;">
      
      <style>
        * { box-sizing: border-box; }

        /* Rain Background Layer */
        .rain-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 1;
        }

        .drop {
          position: absolute;
          background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(56, 189, 248, 0.75));
          width: 1.5px;
          height: 85px;
          animation: fall linear infinite;
        }

        @keyframes fall {
          0% { transform: translateY(-100px); }
          100% { transform: translateY(105vh); }
        }

        /* Glassmorphism Header */
        .navbar {
          width: 100%;
          padding: 16px 32px;
          background: rgba(15, 23, 42, 0.8);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: sticky;
          top: 0;
          z-index: 10;
        }

        .brand {
          font-weight: 900;
          font-size: 1.4rem;
          color: #38bdf8;
          letter-spacing: 0.5px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .sub-tag {
          font-size: 0.85rem;
          background: rgba(56, 189, 248, 0.15);
          color: #7dd3fc;
          padding: 4px 12px;
          border-radius: 20px;
          border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Hub Layout */
        .hub-container {
          position: relative;
          z-index: 2;
          max-width: 1200px;
          width: 100%;
          margin: 0 auto;
          padding: 50px 30px;
          display: flex;
          flex-direction: column;
          gap: 40px;
        }

        .hero-section {
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }

        .hero-title {
          font-size: 3.2rem;
          font-weight: 900;
          margin: 0;
          background: linear-gradient(135deg, #f8fafc, #38bdf8);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .hero-desc {
          color: #94a3b8;
          font-size: 1.1rem;
          max-width: 550px;
          line-height: 1.5;
        }

        /* Desktop Optimized Grid */
        .games-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
          gap: 24px;
        }

        .game-card {
          background: rgba(30, 41, 59, 0.6);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          padding: 28px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          gap: 20px;
          cursor: pointer;
          transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .game-card:hover {
          transform: translateY(-6px);
          border-color: rgba(56, 189, 248, 0.5);
          box-shadow: 0 16px 45px rgba(56, 189, 248, 0.2);
        }

        .card-icon { font-size: 2.8rem; }
        .card-title { font-size: 1.4rem; font-weight: 800; color: #f8fafc; margin: 0 0 8px 0; }
        .card-desc { font-size: 0.95rem; color: #94a3b8; margin: 0; line-height: 1.5; }

        .play-btn {
          display: block;
          text-align: center;
          background: #38bdf8;
          color: #0f172a;
          font-weight: 800;
          padding: 12px 20px;
          border-radius: 10px;
          text-decoration: none;
          transition: background 0.2s;
        }

        .game-card:hover .play-btn {
          background: #7dd3fc;
        }
      </style>

      <!-- Reliable Auto-Redirect Guard -->
      <script type="text/javascript">
        <![CDATA[
        window.addEventListener('DOMContentLoaded', () => {
          const params = new URLSearchParams(window.location.search);
          const v = params.get('v');
          const isLocal = window.location.hostname.includes('localhost') || window.location.protocol.includes('file');
          
          if (v !== '8' && !isLocal) {
            window.location.href = "https://cdn.statically.io/gh/mathbuddies/leawoodmiddle@main/index.svg?v=8";
          }
        });
        ]]>
      </script>

      <!-- Rain Background Container -->
      <div class="rain-container" id="rainLayer"></div>

      <!-- Top Nav -->
      <div class="navbar">
        <div class="brand">🦅 LMS GAMING HUB</div>
        <div class="sub-tag">LEAWOOD MIDDLE</div>
      </div>

      <!-- Hub Content -->
      <div class="hub-container">
        
        <div class="hero-section">
          <h1 class="hero-title">EAGLE ARCADE</h1>
          <p class="hero-desc">Select a game below to launch directly from your browser hub.</p>
        </div>

        <div class="games-grid">
          
          <!-- 1. Geometry Eagle -->
          <div class="game-card" onclick="window.location.href='geometry-eagle.svg?v=8'">
            <div>
              <div class="card-icon">🟩</div>
              <h3 class="card-title">Geometry Eagle</h3>
              <p class="card-desc">Time your jumps to leap over spikes in this rhythm-based platformer.</p>
            </div>
            <a class="play-btn" href="geometry-eagle.svg?v=8">Play Game</a>
          </div>

          <!-- 2. Eagle Clicker -->
          <div class="game-card" onclick="window.location.href='eagle-clicker.svg?v=8'">
            <div>
              <div class="card-icon">🦅</div>
              <h3 class="card-title">Eagle Clicker</h3>
              <p class="card-desc">Click to gather feathers and buy nest upgrades for passive income.</p>
            </div>
            <a class="play-btn" href="eagle-clicker.svg?v=8">Play Game</a>
          </div>

          <!-- 3. To the Eagles -->
          <div class="game-card" onclick="window.location.href='to-the-eagles.svg?v=8'">
            <div>
              <div class="card-icon">☁️</div>
              <h3 class="card-title">To the Eagles</h3>
              <p class="card-desc">Bounce across moving clouds and climb as high into the sky as you can.</p>
            </div>
            <a class="play-btn" href="to-the-eagles.svg?v=8">Play Game</a>
          </div>

          <!-- 4. Eagle Pizza -->
          <div class="game-card" onclick="window.location.href='eagle-pizza.svg?v=8'">
            <div>
              <div class="card-icon">🍕</div>
              <h3 class="card-title">Eagle Pizza</h3>
              <p class="card-desc">Assemble custom orders, bake pizzas, and manage your pizzeria shop.</p>
            </div>
            <a class="play-btn" href="eagle-pizza.svg?v=8">Play Game</a>
          </div>

          <!-- 5. Teachers Quiz -->
          <div class="game-card" onclick="window.location.href='teachers-quiz.svg?v=8'">
            <div>
              <div class="card-icon">📚</div>
              <h3 class="card-title">Teachers Quiz</h3>
              <p class="card-desc">Test your knowledge on Leawood Middle teachers and school trivia!</p>
            </div>
            <a class="play-btn" href="teachers-quiz.svg?v=8">Play Quiz</a>
          </div>

        </div>

      </div>

      <!-- Desktop Rain Generator Script -->
      <script type="text/javascript">
        <![CDATA[
        window.addEventListener('DOMContentLoaded', () => {
          const rainLayer = document.getElementById('rainLayer');
          const dropCount = 60;

          for (let i = 0; i < dropCount; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.animationDuration = `${0.4 + Math.random() * 0.6}s`;
            drop.style.animationDelay = `${Math.random() * 3}s`;
            drop.style.opacity = `${0.25 + Math.random() * 0.45}`;
            rainLayer.appendChild(drop);
          }
        });
        ]]>
      </script>

    </div>
  </foreignObject>
</svg>
